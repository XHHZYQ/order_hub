[project]
name = "order-hub-backend"
version = "0.1.0"
description = "订单汇聚管理系统后端（FastAPI + SQLModel + PostgreSQL）"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.3",
    "pydantic-settings>=2.6.1",
    "pyjwt>=2.10.1",
    "bcrypt>=4.2.1",
    "apscheduler>=3.10.4",
    "python-multipart>=0.0.17",
]

[dependency-groups]
dev = [
    "ruff>=0.7.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
